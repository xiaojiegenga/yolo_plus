# RTX 5090 上的 data-v2 YOLO26m 参数优化配置（第 2 轮掩膜精调）。
# 继承第 1 轮 data-v2-tune-e300-b16-s42 已验证有效的训练日程与航拍增强。
# 本轮实质改动：mask_ratio 4→2、mixup 0.1→0.0。
# optimizer/lr/momentum/weight_decay 显式锁定为第 1 轮 optimizer=auto 的实际选择，
# 只为提高复现性，不作为本轮新增调参因素。
# batch 保持 16，分辨率固定 640，warmup 保持 3。

experiment: data-v2-tune-mr2-nomix-e300-b16-s42
model: yolo26m-seg.pt
data: experiments/yolo_data_v2_cloud.yaml

train:
  epochs: 300
  patience: 100
  batch: 16
  imgsz: 640
  device: "0"
  workers: 8
  cache: false
  optimizer: AdamW
  lr0: 0.001667
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: false
  seed: 42
  deterministic: true
  amp: true
  val: true
  split: val
  plots: true
  close_mosaic: 15
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.3
  degrees: 15
  flipud: 0.5
  scale: 0.3
  mask_ratio: 2
  project: runs
  exist_ok: false
