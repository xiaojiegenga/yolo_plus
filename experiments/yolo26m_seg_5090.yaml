# RTX 5090 上的 data-v2 YOLO26m 参数优化配置（第 1 轮组合）。
# 相对首轮基线 data-v2-scale-y26m-seg-b16-s42 的改动：
#   epochs 400→300；新增 degrees=15、flipud=0.5、scale=0.3。
# batch 保持 16（为后续消融实验单变量原则，含尺度对比 l 模型与源码改动实验在内统一 batch=16）。
# 分辨率固定 640（本次决定不做 imgsz 832 实验）。
# optimizer=auto 在 batch=16 / epochs=300 下 iterations≈4500（<10000），
# 仍自动选择 AdamW（lr≈0.001667、momentum=0.9），与基线一致。

experiment: data-v2-tune-e300-b16-s42
model: yolo26m-seg.pt
data: experiments/yolo_data_v2_cloud.yaml

train:
  epochs: 300
  patience: 100
  batch: 16
  imgsz: 640
  device: "0"
  workers: 8
  cache: false
  optimizer: auto
  seed: 42
  deterministic: true
  amp: true
  val: true
  split: val
  plots: true
  close_mosaic: 15
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.3
  degrees: 15
  flipud: 0.5
  scale: 0.3
  mask_ratio: 4
  project: runs
  exist_ok: false
