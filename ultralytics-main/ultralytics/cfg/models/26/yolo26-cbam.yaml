# YOLO26-CBAM: YOLO26 with Convolutional Block Attention Module in backbone
# Based on yolo26.yaml — inserts CBAM after each C3k2 block in backbone
# Reference: YOLO-pineapple paper (CBAM + SPP for UAV detection)

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ────────────────────────────────────────────────────────────
# Backbone — YOLO26 + CBAM attention
# ────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2  256ch feature
  - [-1, 1, CBAM, [256, 7]]                # 3  ★ CBAM attention after C3k2

  - [-1, 1, Conv, [256, 3, 2]]             # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 5  512ch feature
  - [-1, 1, CBAM, [512, 7]]                # 6  ★ CBAM attention after C3k2

  - [-1, 1, Conv, [512, 3, 2]]             # 7-P4/16
  - [-1, 2, C3k2, [512, True]]             # 8  512ch feature (P4)
  - [-1, 1, CBAM, [512, 7]]                # 9  ★ CBAM attention after C3k2

  - [-1, 1, Conv, [1024, 3, 2]]            # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]            # 11  1024ch feature
  - [-1, 1, CBAM, [1024, 7]]               # 12 ★ CBAM attention after C3k2

  - [-1, 1, SPPF, [1024, 5, 3, True]]      # 13  Multi-scale pooling
  - [-1, 2, C2PSA, [1024]]                 # 14  Cross-stage PSA

# ────────────────────────────────────────────────────────────
# Head (Neck FPN+PAN + Detect) — indices updated for +4 CBAM layers
# ────────────────────────────────────────────────────────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15  upsample
  - [[-1, 8], 1, Concat, [1]]                      # 16  cat backbone P4 (was index 6)
  - [-1, 2, C3k2, [512, True]]                     # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18  upsample
  - [[-1, 5], 1, Concat, [1]]                      # 19  cat backbone P3 (was index 4)
  - [-1, 2, C3k2, [256, True]]                     # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 21  downsample
  - [[-1, 17], 1, Concat, [1]]                     # 22  cat head P4
  - [-1, 2, C3k2, [512, True]]                     # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 24  downsample
  - [[-1, 14], 1, Concat, [1]]                     # 25  cat backbone C2PSA (was index 10)
  - [-1, 1, C3k2, [1024, True, 0.5, True]]        # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]]               # 27  Detect(P3, P4, P5)
