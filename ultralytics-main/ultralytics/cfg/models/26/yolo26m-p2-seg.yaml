# YOLO26m instance segmentation model with a minimal P2/4 prediction branch.
# V2 experiment boundary:
#   - Backbone and the baseline P3/P4/P5 neck remain unchanged.
#   - P2 is added only for box/class/mask-coefficient prediction.
#   - Mask prototypes remain P3-based through Segment26P2.

# Parameters
nc: 80 # number of classes; overridden by the dataset during training
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone: identical to yolo26-seg.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-backbone P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-backbone P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-backbone P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10-backbone P5/32

# Baseline P3/P4/P5 neck: layers 11-22 are intentionally unchanged.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 neck P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat neck P4
  - [-1, 2, C3k2, [512, True]] # 19 output P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 output P5/32

  # Minimal P2 branch: fuse high-level P3 semantics with low-level backbone P2 details.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23 upsample neck P3 to P2
  - [[-1, 2], 1, Concat, [1]] # 24 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 25 output P2/4

  # Detection and mask coefficients use P2/P3/P4/P5; Proto26 uses P3/P4/P5 only.
  - [[25, 16, 19, 22], 1, Segment26P2, [nc, 32, 256]] # 26
