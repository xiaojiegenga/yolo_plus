<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1290" viewBox="0 0 1700 1290">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/></marker>
  </defs>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#222">
    <text x="850" y="38" font-size="24" font-weight="bold" text-anchor="middle">DSS 三位置复合改进结构图（YOLO26m-seg · 输入 640×640 · m 尺度）</text>

    <!-- ============ Panel A: overall network ============ -->
    <text x="40" y="95" font-size="17" font-weight="bold">A. 整体结构：三个模块的作用位置（层号与官方 YAML 一致）</text>

    <rect x="50" y="170" width="130" height="60" fill="#f7f7f7" stroke="#666" rx="6"/>
    <text x="115" y="196" font-size="13" text-anchor="middle">输入</text>
    <text x="115" y="214" font-size="13" text-anchor="middle">640×640×3</text>
    <line x1="180" y1="200" x2="238" y2="200" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="205" y="130" width="380" height="370" fill="#fcfcfc" stroke="#aaa" rx="8"/>
    <text x="395" y="153" font-size="14" font-weight="bold" text-anchor="middle">Backbone（层 0–10）</text>
    <rect x="240" y="170" width="310" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="395" y="198" font-size="13" text-anchor="middle">0–1  Conv ×2（下采样至 stride 4）</text>
    <rect x="240" y="232" width="310" height="46" fill="#e3edf8" stroke="#2f6fb3" stroke-width="2.5" rx="5"/>
    <text x="395" y="253" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4f85">2  C3k2 + DSEM</text>
    <text x="395" y="271" font-size="12" text-anchor="middle" fill="#1d4f85">→ P2 特征：256ch × 160×160</text>
    <rect x="240" y="294" width="310" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="395" y="322" font-size="13" text-anchor="middle">3–4  Conv↓ + C3k2  →  P3: 512×80×80</text>
    <rect x="240" y="356" width="310" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="395" y="384" font-size="13" text-anchor="middle">5–6  Conv↓ + C3k2  →  P4: 512×40×40</text>
    <rect x="240" y="418" width="310" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="395" y="446" font-size="13" text-anchor="middle">7–10  C3k2 + SPPF + C2PSA  →  P5</text>
    <line x1="395" y1="216" x2="395" y2="230" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="395" y1="278" x2="395" y2="292" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="395" y1="340" x2="395" y2="354" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="395" y1="402" x2="395" y2="416" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="625" y="130" width="320" height="370" fill="#fcfcfc" stroke="#aaa" rx="8"/>
    <text x="785" y="153" font-size="14" font-weight="bold" text-anchor="middle">Neck（层 11–22，FPN+PAN）</text>
    <rect x="655" y="180" width="260" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="785" y="208" font-size="13" text-anchor="middle">16  C3k2  →  P3: 256×80×80</text>
    <rect x="655" y="260" width="260" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="785" y="288" font-size="13" text-anchor="middle">19  C3k2  →  P4: 512×40×40</text>
    <rect x="655" y="340" width="260" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="785" y="368" font-size="13" text-anchor="middle">22  C3k2  →  P5: 512×20×20</text>
    <text x="785" y="430" font-size="12" fill="#666" text-anchor="middle">结构未改动（层 16 输出被 SFCM 校准）</text>
    <line x1="550" y1="317" x2="653" y2="207" stroke="#999" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="550" y1="379" x2="653" y2="285" stroke="#999" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="550" y1="441" x2="653" y2="365" stroke="#999" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="985" y="130" width="660" height="370" fill="#fcfcfc" stroke="#aaa" rx="8"/>
    <text x="1315" y="153" font-size="14" font-weight="bold" text-anchor="middle">Head（层 23：Segment26DSS）</text>
    <rect x="1005" y="180" width="270" height="70" fill="#fbeedd" stroke="#d9822b" stroke-width="2.5" rx="5"/>
    <text x="1140" y="208" font-size="13" font-weight="bold" text-anchor="middle" fill="#96591a">SFCM 语义前景校准</text>
    <text x="1140" y="228" font-size="12" text-anchor="middle" fill="#96591a">P3′ = P3 × (1 + γ·g)</text>
    <rect x="1330" y="180" width="290" height="70" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1475" y="208" font-size="13" text-anchor="middle">检测分支（官方，未改动）</text>
    <text x="1475" y="228" font-size="12" text-anchor="middle">cv2 框 · cv3 类 · cv4 掩膜系数×32</text>
    <rect x="1005" y="300" width="400" height="80" fill="#e6f2e8" stroke="#3a7d44" stroke-width="2.5" rx="5"/>
    <text x="1205" y="330" font-size="13" font-weight="bold" text-anchor="middle" fill="#26552c">DPRM 双分辨率原型分支</text>
    <text x="1205" y="352" font-size="12" text-anchor="middle" fill="#26552c">输入 (P2′, P3′, P4, P5) → 32 个掩膜原型 @320×320</text>
    <rect x="1440" y="300" width="180" height="80" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1530" y="330" font-size="13" text-anchor="middle">掩膜合成</text>
    <text x="1530" y="350" font-size="11.5" text-anchor="middle">sigmoid(系数 ⊗ 原型)</text>
    <text x="1530" y="366" font-size="11.5" text-anchor="middle">按预测框裁剪</text>
    <line x1="915" y1="203" x2="1003" y2="212" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1275" y1="215" x2="1328" y2="215" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1140" y1="250" x2="1140" y2="298" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1155" y="280" font-size="12" fill="#96591a">P3′</text>
    <line x1="915" y1="283" x2="1003" y2="330" stroke="#999" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="915" y1="363" x2="1003" y2="348" stroke="#999" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="1405" y1="340" x2="1438" y2="340" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1475" y1="250" x2="1522" y2="298" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="1490" y="272" font-size="11.5" fill="#555">系数</text>
    <path d="M 550 255 C 760 250, 870 320, 1003 335" fill="none" stroke="#2f6fb3" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrB)"/>
    <text x="775" y="278" font-size="12.5" fill="#1d4f85">跨阶段连线：P2′（新增）</text>

    <rect x="40" y="510" width="14" height="14" fill="#e3edf8" stroke="#2f6fb3"/><text x="60" y="522" font-size="12">DSEM（Backbone 第 2 层）</text>
    <rect x="240" y="510" width="14" height="14" fill="#fbeedd" stroke="#d9822b"/><text x="260" y="522" font-size="12">SFCM（Neck P3 输出处）</text>
    <rect x="450" y="510" width="14" height="14" fill="#e6f2e8" stroke="#3a7d44"/><text x="470" y="522" font-size="12">DPRM（Head 原型分支）</text>
    <rect x="660" y="510" width="14" height="14" fill="#f0f0f0" stroke="#666"/><text x="680" y="522" font-size="12">官方路径（权重从官方 ckpt 迁移）</text>
    <line x1="920" y1="517" x2="970" y2="517" stroke="#2f6fb3" stroke-width="2.2" stroke-dasharray="7 5"/><text x="978" y="522" font-size="12">新增连线</text>

    <!-- ============ Panel B: DSEM ============ -->
    <text x="40" y="565" font-size="16" font-weight="bold">B. DSEM 内部结构（C3k2DSEM，替换第 2 层的 C3k2）</text>
    <rect x="60" y="600" width="210" height="52" fill="#f7f7f7" stroke="#666" rx="5"/>
    <text x="165" y="622" font-size="12.5" text-anchor="middle">输入 X（第 1 层输出）</text>
    <text x="165" y="640" font-size="12.5" text-anchor="middle">128ch × 160×160</text>
    <rect x="60" y="690" width="210" height="52" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="165" y="712" font-size="12.5" text-anchor="middle">C3k2 官方路径</text>
    <text x="165" y="730" font-size="12" text-anchor="middle" fill="#555">（权重整体迁移，键名不变）</text>
    <rect x="60" y="780" width="210" height="46" fill="#fff" stroke="#444" rx="5"/>
    <text x="165" y="808" font-size="12.5" text-anchor="middle">Y：256ch × 160×160</text>
    <rect x="310" y="688" width="210" height="60" fill="#e3edf8" stroke="#2f6fb3" rx="5"/>
    <text x="415" y="711" font-size="12.5" text-anchor="middle" fill="#1d4f85">dw 深度条带卷积</text>
    <text x="415" y="730" font-size="12" text-anchor="middle" fill="#1d4f85">7×1 → 1×7（groups=256）</text>
    <rect x="310" y="783" width="210" height="60" fill="#e3edf8" stroke="#2f6fb3" rx="5"/>
    <text x="415" y="806" font-size="12.5" text-anchor="middle" fill="#1d4f85">pw 瓶颈</text>
    <text x="415" y="825" font-size="12" text-anchor="middle" fill="#1d4f85">1×1 256→64 → 1×1 64→256</text>
    <rect x="310" y="878" width="210" height="52" fill="#e3edf8" stroke="#2f6fb3" rx="5"/>
    <text x="415" y="900" font-size="12.5" text-anchor="middle" fill="#1d4f85">× α（256 维逐通道）</text>
    <text x="415" y="918" font-size="12" text-anchor="middle" fill="#1d4f85">零初始化</text>
    <line x1="165" y1="652" x2="165" y2="688" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="165" y1="742" x2="165" y2="778" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="270" y1="795" x2="308" y2="730" stroke="#2f6fb3" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="415" y1="748" x2="415" y2="781" stroke="#2f6fb3" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="415" y1="843" x2="415" y2="876" stroke="#2f6fb3" stroke-width="1.8" marker-end="url(#arrB)"/>
    <circle cx="165" cy="958" r="16" fill="#fff" stroke="#444" stroke-width="1.6"/>
    <text x="165" y="964" font-size="16" text-anchor="middle">＋</text>
    <line x1="165" y1="826" x2="165" y2="940" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <polyline points="415,930 415,958 183,958" fill="none" stroke="#2f6fb3" stroke-width="1.8" marker-end="url(#arrB)"/>
    <rect x="60" y="1010" width="460" height="62" fill="#eef4fb" stroke="#2f6fb3" rx="5"/>
    <text x="290" y="1036" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4f85">输出 = Y + α ⊙ pw(dw(Y))</text>
    <text x="290" y="1057" font-size="12" text-anchor="middle" fill="#1d4f85">α = 0 时与官方 C3k2 逐位一致（已验证）</text>
    <line x1="165" y1="976" x2="165" y2="1008" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="60" y="1100" width="460" height="76" fill="#fafafa" stroke="#999" rx="5"/>
    <text x="290" y="1124" font-size="12.5" text-anchor="middle">两个去向：① 第 3 层（继续下采样，增强传入全网络）</text>
    <text x="290" y="1144" font-size="12.5" text-anchor="middle">② 跨阶段连线 → DPRM 的 P2 注入</text>
    <text x="290" y="1164" font-size="12" text-anchor="middle" fill="#666">参数 ≈ 3.7 万 · ≈ 1.9 GFLOPs · 方向核针对长宽比中位 10.9 的细长目标</text>

    <!-- ============ Panel C: SFCM ============ -->
    <text x="575" y="565" font-size="16" font-weight="bold">C. SFCM 内部结构（实现在 Head 内，作用于 Neck P3 输出）</text>
    <rect x="600" y="600" width="240" height="52" fill="#f7f7f7" stroke="#666" rx="5"/>
    <text x="720" y="622" font-size="12.5" text-anchor="middle">P3（第 16 层输出）</text>
    <text x="720" y="640" font-size="12.5" text-anchor="middle">256ch × 80×80</text>
    <rect x="600" y="690" width="240" height="52" fill="#fbeedd" stroke="#d9822b" rx="5"/>
    <text x="720" y="712" font-size="12.5" text-anchor="middle" fill="#96591a">sem_trunk：Conv 3×3</text>
    <text x="720" y="730" font-size="12" text-anchor="middle" fill="#96591a">256 → 64 通道</text>
    <rect x="600" y="782" width="240" height="60" fill="#fdf5ec" stroke="#d9822b" rx="5"/>
    <text x="720" y="805" font-size="12.5" text-anchor="middle" fill="#96591a">sem_head：1×1，64→2</text>
    <text x="720" y="824" font-size="12" text-anchor="middle" fill="#96591a">两类语义 logits（80×80）</text>
    <rect x="600" y="882" width="240" height="60" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="720" y="905" font-size="12.5" text-anchor="middle">loss[4] 辅助语义损失</text>
    <text x="720" y="924" font-size="12" text-anchor="middle" fill="#555">BCE + Dice（仅训练期，协议同官方）</text>
    <rect x="875" y="782" width="185" height="60" fill="#fbeedd" stroke="#d9822b" rx="5"/>
    <text x="967" y="805" font-size="12.5" text-anchor="middle" fill="#96591a">sem_gate：1×1，64→1</text>
    <text x="967" y="824" font-size="12" text-anchor="middle" fill="#96591a">sigmoid → 前景图 g</text>
    <rect x="600" y="990" width="460" height="58" fill="#fdf5ec" stroke="#d9822b" rx="5"/>
    <text x="830" y="1014" font-size="13" font-weight="bold" text-anchor="middle" fill="#96591a">P3′ = P3 × (1 + γ ⊙ g)</text>
    <text x="830" y="1034" font-size="12" text-anchor="middle" fill="#96591a">γ：256 维逐通道，零初始化 → 初始严格恒等</text>
    <rect x="600" y="1085" width="460" height="72" fill="#fafafa" stroke="#999" rx="5"/>
    <text x="830" y="1109" font-size="12.5" text-anchor="middle">去向：① 检测分支的 P3 输入（被校准）　② DPRM 融合基</text>
    <text x="830" y="1129" font-size="12" text-anchor="middle" fill="#666">P4/P5 检测输入与 PAN 下采样路径均未改动</text>
    <text x="830" y="1149" font-size="12" text-anchor="middle" fill="#666">参数 ≈ 14.8 万 · 取代原仅训练期 semseg 干线（省 ≈ 120 万）</text>
    <line x1="720" y1="652" x2="720" y2="688" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="720" y1="742" x2="720" y2="780" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="720" y1="842" x2="720" y2="880" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="840" y1="716" x2="873" y2="790" stroke="#d9822b" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="967" y1="842" x2="967" y2="988" stroke="#d9822b" stroke-width="1.8" marker-end="url(#arrB)"/>
    <polyline points="840,626 1072,626 1072,1019 1062,1019" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="1078" y="700" font-size="12" fill="#555" transform="rotate(90 1078 700)">P3 原特征</text>

    <!-- ============ Panel D: DPRM ============ -->
    <text x="1115" y="565" font-size="16" font-weight="bold">D. DPRM 内部结构（Proto26DR，掩膜原型分支）</text>
    <rect x="1130" y="596" width="110" height="46" fill="#fdf5ec" stroke="#d9822b" rx="5"/>
    <text x="1185" y="624" font-size="12.5" text-anchor="middle" fill="#96591a">P3′ 80×80</text>
    <rect x="1252" y="596" width="100" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1302" y="624" font-size="12.5" text-anchor="middle">P4 40×40</text>
    <rect x="1364" y="596" width="100" height="46" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1414" y="624" font-size="12.5" text-anchor="middle">P5 20×20</text>
    <rect x="1476" y="596" width="120" height="46" fill="#e3edf8" stroke="#2f6fb3" stroke-dasharray="6 4" rx="5"/>
    <text x="1536" y="618" font-size="12.5" text-anchor="middle" fill="#1d4f85">P2′ 160×160</text>
    <text x="1536" y="634" font-size="10.5" text-anchor="middle" fill="#1d4f85">（经 DSEM 增强）</text>
    <rect x="1130" y="688" width="340" height="94" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1300" y="710" font-size="12.5" font-weight="bold" text-anchor="middle">官方多尺度融合（权重迁移）</text>
    <text x="1300" y="729" font-size="11.5" text-anchor="middle">feat_refine 1×1：P4/P5 → 256ch，上采样到 80²，与 P3′ 相加</text>
    <text x="1300" y="747" font-size="11.5" text-anchor="middle">→ feat_fuse 3×3 → cv1 3×3</text>
    <text x="1300" y="765" font-size="11.5" text-anchor="middle">→ ConvTranspose ×2（80²→160²）→ cv2 3×3</text>
    <rect x="1130" y="816" width="170" height="50" fill="#fff" stroke="#444" rx="5"/>
    <text x="1215" y="845" font-size="12.5" text-anchor="middle">mid：256ch×160²</text>
    <rect x="1350" y="810" width="230" height="62" fill="#e3edf8" stroke="#2f6fb3" rx="5"/>
    <text x="1465" y="833" font-size="12.5" text-anchor="middle" fill="#1d4f85">＋ p2_proj(P2′)</text>
    <text x="1465" y="852" font-size="12" text-anchor="middle" fill="#1d4f85">1×1 256→256，零初始化</text>
    <rect x="1130" y="928" width="180" height="112" fill="#f0f0f0" stroke="#666" rx="5"/>
    <text x="1220" y="950" font-size="12" font-weight="bold" text-anchor="middle">粗原型路径（官方）</text>
    <text x="1220" y="969" font-size="11.5" text-anchor="middle">cv3 1×1 256→32（权重迁移）</text>
    <text x="1220" y="987" font-size="11.5" text-anchor="middle">p_lo：32 @ 160×160</text>
    <text x="1220" y="1005" font-size="11.5" text-anchor="middle">→ 双线性上采样 ×2</text>
    <text x="1220" y="1026" font-size="11" text-anchor="middle" fill="#666">负责稳定的粗结构</text>
    <rect x="1350" y="918" width="230" height="132" fill="#e6f2e8" stroke="#3a7d44" rx="5"/>
    <text x="1465" y="940" font-size="12" font-weight="bold" text-anchor="middle" fill="#26552c">细节残差路径（新增）</text>
    <text x="1465" y="959" font-size="11.5" text-anchor="middle" fill="#26552c">hi_up ConvT ×2：256→64（→320²）</text>
    <text x="1465" y="977" font-size="11.5" text-anchor="middle" fill="#26552c">→ hi_cv 3×3 ⊕ hi_strip 7×1/1×7</text>
    <text x="1465" y="995" font-size="11.5" text-anchor="middle" fill="#26552c">→ hi_out 1×1 64→32（零初始化）</text>
    <text x="1465" y="1013" font-size="11.5" text-anchor="middle" fill="#26552c">p_hi：32 @ 320×320</text>
    <text x="1465" y="1034" font-size="11" text-anchor="middle" fill="#666">只学边界与细窄结构的残差</text>
    <rect x="1130" y="1088" width="450" height="56" fill="#e6f2e8" stroke="#3a7d44" stroke-width="2" rx="5"/>
